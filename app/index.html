<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0d13">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Speedcubing timer for 3x3, 4x4 and 5x5 with scrambles, averages, a 3D cube and algorithm tutorials.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CubeLab">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <title>CubeLab Timer</title>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="icons/icon.svg" alt="">
        <span class="brand-name">Cube<span>Lab</span></span>
      </div>
      <div class="seg" id="puzzle-switch" role="tablist" aria-label="Puzzle"></div>
      <select id="session-select" class="select session-select" aria-label="Session"></select>
      <div class="spacer"></div>
      <nav class="tabs" id="tabs" aria-label="Main"></nav>
    </header>
    <main class="views">
      <section class="view" id="view-timer" data-view="timer"></section>
      <section class="view" id="view-times" data-view="times"></section>
      <section class="view" id="view-learn" data-view="learn"></section>
      <section class="view" id="view-cube" data-view="cube"></section>
      <section class="view" id="view-settings" data-view="settings"></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <noscript><p style="padding:20px">CubeLab needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
