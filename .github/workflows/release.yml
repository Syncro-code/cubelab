# Builds the Windows installer + portable .exe. Pushing a tag like v1.0.1
# attaches both to a GitHub Release; a manual run uploads them as artifacts.
name: Windows build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: CubeLab-Timer-windows
          path: |
            dist/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.exe --title "CubeLab Timer $GITHUB_REF_NAME" --generate-notes
          fi
